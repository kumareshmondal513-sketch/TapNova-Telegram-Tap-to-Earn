<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapNova Tap-to-Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
        }
        .coin {
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
            user-select: none;
            transition: transform 0.1s ease;
            margin: 20px auto;
        }
        .coin:active {
            transform: scale(0.92);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        #score {
            font-size: 48px;
            font-weight: bold;
            color: #fbbf24;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TapNova Mini App</h1>
        <p>ট্যাপ করে কয়েন আয় করুন!</p>
        <div id="score">0</div>
        <div class="coin" id="tapButton">🪙</div>
    </div>

    <script>
        // টেলিগ্রাম ওয়েব অ্যাপ ইনিশিয়ালাইজ করা
        const tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0;
        const scoreDisplay = document.getElementById('score');
        const tapButton = document.getElementById('tapButton');

        tapButton.addEventListener('click', () => {
            score += 1;
            scoreDisplay.textContent = score;

            // টেলিগ্রাম হ্যাপটিক ফিডব্যাক (ট্যাপ করলে হালকা ভাইব্রেট করবে)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
    </script>
</body>
</html>
